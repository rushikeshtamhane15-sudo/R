        <!-- iter-55 #6: pre-paint theme bootstrap. Applies CSS variables from
             the last cached theme tokens BEFORE React mounts so users never
             see a flash of old/default colors. Body is hidden until React
             flips the `theme-loaded` class. -->
        <style id="pre-paint-style">
          body { opacity: 0; transition: opacity 0.18s ease-in; }
          html.theme-loaded body { opacity: 1; }
        </style>
        <script>
          (function () {
            try {
              // iter-143 · efoodtech rebrand — bump cache key so stale red-theme tokens
              // from the previous brand don't survive first paint.
              var CACHE_KEY = "ef_theme_tokens_v143";
              try { window.localStorage.removeItem("ef_theme_tokens"); } catch (e) {}
              var raw = window.localStorage.getItem(CACHE_KEY);
              if (!raw) { document.documentElement.classList.add("theme-loaded"); return; }
              var t = JSON.parse(raw);
              var map = {background:"--background",foreground:"--foreground",card:"--card",card_foreground:"--card-foreground",popover:"--popover",popover_foreground:"--popover-foreground",primary:"--primary",primary_foreground:"--primary-foreground",secondary:"--secondary",secondary_foreground:"--secondary-foreground",muted:"--muted",muted_foreground:"--muted-foreground",accent:"--accent",accent_foreground:"--accent-foreground",destructive:"--destructive",destructive_foreground:"--destructive-foreground",border:"--border",input:"--input",ring:"--ring",radius:"--radius"};
              for (var k in t) { if (map[k] && t[k]) document.documentElement.style.setProperty(map[k], t[k]); }
              document.documentElement.classList.add("theme-loaded");
            } catch (e) { document.documentElement.classList.add("theme-loaded"); }
          })();
        </script>

        <!-- =================================================================
             SEO: title + description + Open Graph + Twitter card.
             These are managed PER-PAGE by `react-helmet-async` via the shared
             `components/SEO.jsx` wrapper. Helmet replaces them at runtime so
             every route ships its own title/description/OG metadata.

             We intentionally do NOT ship a static <title> or <meta name=
             "description"> here — having both would result in duplicate tags
             (Helmet appends, browsers don't auto-replace by name) and
             search-engine crawlers may pick the wrong one. The canonical
             link + favicons + JSON-LD below remain static so non-JS bots
             (link-preview scrapers, etc.) still get a sane fallback.
        ================================================================= -->
        <link rel="canonical" href="https://efoodcare.in/" />

        <!-- =================================================================
             Favicons: serve from the SAME ORIGIN so Google's crawler can find
             them. The cross-origin CDN icon is kept as a fallback but Google
             prefers same-origin /favicon.ico for search results.
        ================================================================= -->
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" type="image/png" href="/favicon.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
        <link rel="mask-icon" href="/favicon.png" color="#0a1f44" />

        <!-- =================================================================
             Open Graph + Twitter card — managed per-page by Helmet (see
             /app/frontend/src/components/SEO.jsx). We only keep the
             ORIGIN-WIDE bits here that never change (site_name, type, locale,
             default OG image dimensions) so link-preview scrapers without JS
             still get a recognisable card.
        ================================================================= -->
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="efoodcare" />
        <meta property="og:locale" content="en_IN" />
        <meta property="og:image" content="https://efoodcare.in/og-image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />

        <!-- Twitter card type — title/description/image come from Helmet per page -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:image" content="https://efoodcare.in/og-image.png" />

        <!-- =================================================================
             Robots — let Google crawl + index everything; render images.
        ================================================================= -->
        <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
        <meta name="googlebot" content="index, follow" />

        <!-- =================================================================
             JSON-LD structured data — this is the magic that tells Google to
             display your LOGO and ORG NAME in search results instead of the
             generic globe icon. Two schemas:
               1. Organization — defines the brand + logo
               2. WebSite — adds a sitelinks search box
        ================================================================= -->
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "Organization",
            "name": "efoodcare",
            "alternateName": "efoodcare",
            "url": "https://efoodcare.in/",
            "logo": "https://efoodcare.in/favicon.png",
            "image": "https://efoodcare.in/og-image.png",
            "description": "100% pure-veg ghar-style tiffin subscriptions and restaurant ordering. Monthly mess plans with QR check-in and 90-minute fresh delivery.",
            "sameAs": []
        }
        </script>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "efoodcare",
            "url": "https://efoodcare.in/",
            "potentialAction": {
                "@type": "SearchAction",
                "target": "https://efoodcare.in/restaurant?q={search_term_string}",
                "query-input": "required name=search_term_string"
            }
        }
        </script>
        <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "FoodEstablishment",
            "name": "efoodcare Restaurant",
            "image": "https://efoodcare.in/og-image.png",
            "url": "https://efoodcare.in/restaurant",
            "servesCuisine": ["Indian Vegetarian", "North Indian", "South Indian"],
            "priceRange": "₹₹",
            "acceptsReservations": false,
            "menu": "https://efoodcare.in/restaurant"
        }
        </script>

        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
