<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>efoodcare · recover</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { color-scheme: light; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: hsl(0, 76%, 45%); color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { max-width: 420px; width: 100%; background: rgba(255,255,255,.08); border-radius: 24px; padding: 28px 24px; box-shadow: 0 12px 40px rgba(0,0,0,.25); text-align: center; }
    h1 { font-size: 20px; letter-spacing: .06em; text-transform: uppercase; margin: 0 0 6px; }
    .brand { font-size: 32px; font-weight: 800; letter-spacing: .04em; margin: 0 0 20px; }
    p { line-height: 1.55; font-size: 14px; opacity: .95; margin: 8px 0; }
    #log { text-align: left; background: rgba(0,0,0,.25); border-radius: 12px; padding: 10px 12px; font-family: "SFMono-Regular", "Menlo", "Consolas", monospace; font-size: 12px; margin: 16px 0; min-height: 90px; white-space: pre-wrap; }
    #log b { color: #fef08a; }
    .ok { color: #86efac; }
    .err { color: #fca5a5; }
    .btn { display: inline-block; margin-top: 12px; background: #fff; color: hsl(0, 76%, 40%); font-weight: 800; padding: 12px 22px; border-radius: 999px; text-decoration: none; letter-spacing: .04em; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Emergency recovery</h1>
    <p class="brand">efoodcare</p>
    <p>Unregistering service workers and purging every cached bundle so a fresh copy of the app loads on your next visit.</p>
    <div id="log">Starting…</div>
    <a class="btn" id="home" href="/">Return to app</a>
  </div>
  <script>
    // iter-137.l · Emergency recovery escape hatch. Users stuck on a stale
    // service-worker + broken cached JS can visit /recover.html to force
    // unregister every SW and delete every cache, then tap Return to app
    // for a completely fresh load. Kept as a plain static file so it works
    // even when the main SPA bundle is broken.
    const log = document.getElementById("log");
    const say = (msg, cls) => { const el = document.createElement("div"); if (cls) el.className = cls; el.textContent = msg; log.appendChild(el); };
    log.textContent = "";
    (async () => {
      try {
        if ("serviceWorker" in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          say("service workers found · " + regs.length);
          for (const r of regs) {
            try { await r.unregister(); say("  unregistered · " + (r.scope || "?"), "ok"); }
            catch (e) { say("  unregister failed · " + e.message, "err"); }
          }
        } else {
          say("serviceWorker api unavailable — skipping", "err");
        }
        if (typeof caches !== "undefined") {
          const keys = await caches.keys();
          say("caches found · " + keys.length);
          for (const k of keys) {
            try { await caches.delete(k); say("  purged · " + k, "ok"); }
            catch (e) { say("  purge failed · " + k, "err"); }
          }
        } else {
          say("caches api unavailable — skipping", "err");
        }
        try {
          // Best-effort local + session storage wipe so any stale JSON blobs
          // (menu cache, feature-flag cache, etc.) also get flushed.
          if (typeof localStorage !== "undefined") { localStorage.clear(); say("localStorage cleared", "ok"); }
          if (typeof sessionStorage !== "undefined") { sessionStorage.clear(); say("sessionStorage cleared", "ok"); }
        } catch { /* noop */ }
        say("done · tap “Return to app”", "ok");
      } catch (e) {
        say("recovery failed · " + (e && e.message || e), "err");
      }
    })();
  </script>
</body>
</html>
